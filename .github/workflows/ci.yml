name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      HIT_REQUIRE_SHELLS: '1' # contract tests fail rather than skip if pwsh is missing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Pester 5+
        run: Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: gofmt
        run: |
          $files = gofmt -l .
          if ($files) { $files; throw 'gofmt needed' }

      - name: vet, test, fuzz (10s per target), Pester
        run: ./scripts/test.ps1 -Fuzz 10
